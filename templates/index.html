<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viva AI</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="bg"></div>

<!-- LANDING -->
<div class="landing" id="landing">

  <h1 id="startBtn" class="logo">Viva AI</h1>

  <p class="click-text">Click to start</p>

  <!-- SIR OPTION -->
  <p id="sirOption" class="sir-option">
    Sir Dashboard
  </p>

</div>

<!-- SIR LOGIN MODAL -->
<div class="sir-modal" id="sirModal">

  <div class="sir-box">

    <h2>Sir Login</h2>

    <input id="sirUser" type="text" placeholder="Sir Username">

    <input id="sirPass" type="password" placeholder="Sir Password">

    <p class="error" id="sirError"></p>

    <button id="sirLoginBtn">
      Enter Dashboard
    </button>

    <p id="closeSirModal" class="close-modal">
      Close
    </p>

  </div>

</div>

<!-- MAIN -->
<div class="main" id="main">

  <div class="wrapper" id="wrapper">

    <!-- LOGIN -->
    <div class="box login">

      <div class="inner">

        <h2>Login</h2>

        <input id="loginUser" type="text" placeholder="Username">

        <input id="loginPass" type="password" placeholder="Password">

        <p class="error" id="loginError"></p>

        <button id="loginBtn">
          Login
        </button>

        <p id="toRegister">
          Go to Register
        </p>

      </div>

    </div>

    <!-- REGISTER -->
    <div class="box register">

      <div class="inner">

        <h2>Register</h2>

        <input id="regUser" type="text" placeholder="Username">

        <input id="regPass" type="password" placeholder="Password">

        <p class="error" id="registerError"></p>

        <button id="registerBtn">
          Register
        </button>

        <p id="toLogin">
          Back to Login
        </p>

      </div>

    </div>

  </div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
