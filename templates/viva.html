<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Viva AI
</title>

<link
rel="stylesheet"
href="/static/viva.css">

</head>

<body>


<!-- =========================
     BACK BUTTON
========================= -->

<button
class="back"
onclick="goBack()">

    ⬅ Dashboard

</button>


<!-- =========================
     START SCREEN
========================= -->

<div
class="start"
id="startScreen">

    <h1>
        Viva AI
    </h1>

    <button id="startBtn">

        Start Viva

    </button>

</div>


<!-- =========================
     MAIN WRAPPER
========================= -->

<div
class="wrapper"
id="main">


    <!-- =====================
         LEFT PANEL
    ====================== -->

    <div class="box">


        <!-- =================
             HIDDEN CAMERA
        ================== -->

        <!--
        IMPORTANT:
        Camera is hidden from student UI
        but still streams to professor
        through WebRTC.
        -->

        <video
        id="studentVideo"
        autoplay
        muted
        playsinline
        style="display:none;">
        </video>


        <!-- =================
             LIVE CHAT /
             TRANSCRIPT
        ================== -->

        <div
        class="chat"
        id="chatBox">
        </div>


        <!-- =================
             CONTROLS
        ================== -->

        <div class="controls">


            <!-- RECORD ANSWER -->

            <button id="recordA">

                Record Answer

            </button>


            <!-- STOP RECORDING -->

            <button id="stop">

                Stop

            </button>


            <!-- STORE Q&A -->

            <button id="store">

                Store Q&A

            </button>


            <!-- SUBMIT -->

            <button id="submit">

                Submit

            </button>


            <!-- MUTE -->

            <button id="muteBtn">

                Mute

            </button>

        </div>


        <!-- =================
             ERRORS
        ================== -->

        <p
        id="errorBox"
        class="error">
        </p>

    </div>


    <!-- =====================
         RIGHT PANEL
    ====================== -->

    <div class="stored">

        <h2>

            Stored Q&A

        </h2>

        <!-- STORED QNA -->

        <div id="storedBox"></div>

    </div>

</div>


<!-- =========================
     REMOTE AUDIO
========================= -->

<audio
id="remoteAudio"
autoplay>
</audio>


<!-- =========================
     SOCKET STATUS
========================= -->

<div class="socket-status">

    <span class="status-dot"></span>

    Connected

</div>


<!-- =========================
     PROFESSOR VOICE POPUP
========================= -->

<div
id="voicePopup"
class="voice-popup">

    <div class="voice-popup-box">

        <h3>

            Professor Started Voice Chat

        </h3>

        <p>

            Enable your microphone and camera
            to continue viva communication.

        </p>

        <button
        id="enableVoiceBtn">

            Enable Voice

        </button>

    </div>

</div>


<!-- =========================
     JAVASCRIPT
========================= -->
<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
<script src="/static/viva.js"></script>

</body>
</html>
